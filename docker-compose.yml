version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sweety-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sweety_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sweety_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sweety-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sweety-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-sweety_db}
      JWT_SECRET: ${JWT_SECRET:-sweety_jwt_secret_production_key_change_me}
      JWT_EXPIRES_IN: 7d
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      BCRYPT_ROUNDS: 12
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    ports:
      - "5000:5000"
    networks:
      - sweety-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sweety-frontend
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    networks:
      - sweety-network

volumes:
  pgdata:
    driver: local

networks:
  sweety-network:
    driver: bridge
