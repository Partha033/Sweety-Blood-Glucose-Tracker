<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="15" y1="10" x2="85" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FB7185" />
      <stop offset="60%" stopColor="#F43F5E" />
      <stop offset="100%" stopColor="#BE123C" />
    </linearGradient>
  </defs>

  <!-- Blood Glucose Droplet Contour -->
  <path
    d="M50 8 C50 8, 84 46, 84 66 C84 83.5 70 94 50 94 C30 94 16 83.5 16 66 C16 46, 50 8 50 8 Z"
    fill="url(#favGrad)"
  />

  <!-- Glossy Arc -->
  <path
    d="M32 36 C40 24, 48 18, 50 16 C46 22, 28 42, 26 58 C25 61, 23 58, 24 54 C26 46, 29 40, 32 36 Z"
    fill="#FFFFFF"
    opacity="0.35"
  />

  <!-- C6H12O6 Glucopyranose Hexagonal Ring Structure -->
  <polygon
    points="50,38 71,48 71,70 50,80 29,70 29,48"
    stroke="#FFFFFF"
    stroke-width="3.5"
    stroke-linejoin="round"
    fill="rgba(255, 255, 255, 0.15)"
  />

  <!-- Functional branch lines -->
  <line x1="29" y1="48" x2="20" y2="38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="71" y1="48" x2="80" y2="42" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="71" y1="70" x2="79" y2="76" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="80" x2="50" y2="88" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="29" y1="70" x2="21" y2="76" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Atoms / Nodes -->
  <circle cx="50" cy="38" r="4.5" fill="#FFFFFF" stroke="#F43F5E" stroke-width="1.5" />
  <circle cx="71" cy="48" r="3.5" fill="#FFFFFF" />
  <circle cx="71" cy="70" r="3.5" fill="#FFFFFF" />
  <circle cx="50" cy="80" r="3.5" fill="#FFFFFF" />
  <circle cx="29" cy="70" r="3.5" fill="#FFFFFF" />
  <circle cx="29" cy="48" r="3.5" fill="#FFFFFF" />
</svg>
